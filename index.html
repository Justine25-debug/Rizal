<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>José Rizal</title>

    <script>
      ;(function () {
        const redirect = window.location.search
        if (!redirect.includes('?/')) return

        const decoded = redirect
          .slice(1)
          .replace(/~and~/g, '&')
          .replace(/^\//, '')

        const restoredUrl = decoded + window.location.hash
        window.history.replaceState(null, '', restoredUrl)
      })()
    </script>
